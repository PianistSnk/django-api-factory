name: Deploy docs to GitHub Pages

# Auto-deploy the mkdocs site to GitHub Pages on every push to master.
#
# Setup (one-time, repo admin):
#   1. GitHub repo Settings → Pages → Build and deployment → Source:
#      "GitHub Actions"  (not "Deploy from a branch")
#   2. That's it — this workflow handles the rest.
#
# What it does:
#   1. Set up Python 3.11
#   2. Install mkdocs + mkdocs-material from docs/requirements.txt
#   3. Run `mkdocs build --strict` (fails on warnings → keep docs clean)
#   4. Upload the built site/ as a Pages artifact
#   5. Deploy to GitHub Pages (URL: https://<owner>.github.io/<repo>/)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write  # for OIDC deployment

# Cancel in-progress runs for the same branch on a new push.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build mkdocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mkdocs + material
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build site (strict — fails on warnings)
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
