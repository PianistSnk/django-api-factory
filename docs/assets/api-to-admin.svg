<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">REST API data rendered in Django admin</title>
  <desc id="desc">A REST API JSON response flows through django-api-factory and becomes a read-only Django admin changelist.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="connector" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="420" rx="24" fill="#f8fafc"/>
  <rect x="32" y="32" width="1056" height="356" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g filter="url(#shadow)">
    <rect x="76" y="92" width="300" height="236" rx="12" fill="#0f172a"/>
    <rect x="76" y="92" width="300" height="42" rx="12" fill="#1e293b"/>
    <circle cx="102" cy="113" r="5" fill="#ef4444"/>
    <circle cx="121" cy="113" r="5" fill="#f59e0b"/>
    <circle cx="140" cy="113" r="5" fill="#22c55e"/>
    <text x="164" y="119" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">GET /posts</text>
    <text x="100" y="172" fill="#38bdf8" font-family="SFMono-Regular, Consolas, monospace" font-size="15">{</text>
    <text x="120" y="202" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="15">"id": 1,</text>
    <text x="120" y="232" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="15">"userId": 1,</text>
    <text x="120" y="262" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="15">"title": "..."</text>
    <text x="100" y="292" fill="#38bdf8" font-family="SFMono-Regular, Consolas, monospace" font-size="15">}</text>
  </g>

  <g>
    <path d="M410 210 H524" stroke="url(#connector)" stroke-width="10" stroke-linecap="round"/>
    <path d="M520 184 L556 210 L520 236 Z" fill="#22c55e"/>
    <rect x="424" y="146" width="120" height="44" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="446" y="174" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">APIModel</text>
    <rect x="424" y="230" width="120" height="44" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="452" y="258" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">APIAdmin</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="598" y="72" width="446" height="276" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="598" y="72" width="446" height="56" rx="12" fill="#334155"/>
    <text x="626" y="107" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Django administration</text>
    <rect x="626" y="152" width="178" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="642" y="174" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">Search API rows</text>
    <rect x="820" y="152" width="86" height="34" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="844" y="174" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Filter</text>
    <rect x="920" y="152" width="96" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="944" y="174" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Export</text>

    <rect x="626" y="210" width="390" height="104" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="626" y="210" width="390" height="34" rx="6" fill="#f8fafc"/>
    <line x1="690" y1="210" x2="690" y2="314" stroke="#e2e8f0"/>
    <line x1="780" y1="210" x2="780" y2="314" stroke="#e2e8f0"/>
    <line x1="626" y1="244" x2="1016" y2="244" stroke="#cbd5e1"/>
    <line x1="626" y1="279" x2="1016" y2="279" stroke="#e2e8f0"/>
    <text x="648" y="232" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">id</text>
    <text x="710" y="232" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">userId</text>
    <text x="804" y="232" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">title</text>
    <text x="650" y="267" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="13">1</text>
    <text x="724" y="267" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="13">1</text>
    <text x="804" y="267" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="13">sunt aut facere...</text>
    <text x="650" y="302" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="13">2</text>
    <text x="724" y="302" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="13">1</text>
    <text x="804" y="302" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="13">qui est esse...</text>
  </g>

  <text x="76" y="60" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">REST API rows become read-only Django admin rows</text>
  <text x="76" y="366" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">No frontend. No table sync. Keep Django permissions, filters, search, sorting, and exports.</text>
</svg>
