site_name: django-api-factory
site_description: Display any REST API as a Django admin model — no frontend, no migrations, just `urls()` and `cache()`.
site_url: https://pianistsnk.github.io/django-api-factory/
repo_url: https://github.com/PianistSnk/django-api-factory
repo_name: PianistSnk/django-api-factory
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Tutorial index: tutorials/README.md
      - Quickstart: tutorials/01-hello-apimodel.md
      - Filter, search, sort: tutorials/02-filter-search-sort.md
      - Cache, export, actions: tutorials/03-cache-export-actions.md
  - Examples:
      - Overview: examples/README.md
      - JSONPlaceholder: examples/jsonplaceholder/README.md
      - Local mock (100k): examples/local-mock/README.md
  - Reference:
      - API response format: reference/api-response-format.md
      - Design decisions: reference/design-decisions.md
  - About:
      - Changelog: changelog.md
      - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PianistSnk/django-api-factory
  generator: false
