[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api-factory"
version = "0.1.0.dev0"
description = "Display external REST API data in Django admin as if it were a managed model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "shijian" }
]
keywords = ["django", "django-admin", "rest-api", "api", "admin"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Django>=4.2",
    "requests>=2.28",
]

[project.optional-dependencies]
# `redis` is required by tests/test_cache.py (RedisCacheBackend unit tests).
# Installing the dev extras gives you a runnable test suite end-to-end.
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "redis>=4.0",
    # ExportMixin.export_to_excel tests need openpyxl (tests/test_mixins.py).
    "openpyxl>=3.0",
]
simpleui = [
    "django-simpleui>=2026.1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# mixins.py intentionally organizes imports into mid-file sections
# (T1.3 + T1.4 schema registry code, T1.5 Redis cache backend, etc.)
# which ruff flags as E402. The imports are real, just positioned
# after section comments. Suppress E402 for that file only.
per-file-ignores = { "src/django_api_factory/mixins.py" = ["E402"] }

[tool.pytest.ini_options]
addopts = [
    "--cov=django_api_factory",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["django_api_factory"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
